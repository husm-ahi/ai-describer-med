services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: aimedical-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimedical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-aimedical_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimedical}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aimedical-network

  # Redis (for Django Channels Channel Layer)
  redis:
    image: redis:7-alpine
    container_name: aimedical-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aimedical-network

  # Django Backend (with Daphne for ASGI + WebSocket)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: aimedical-backend
    restart: unless-stopped
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 backend.config.asgi:application
      "
    volumes:
      - ./backend:/app/backend
      - static_files:/app/staticfiles
      - media_files:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=backend.config.settings
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - POSTGRES_DB=${POSTGRES_DB:-aimedical_db}
      - POSTGRES_USER=${POSTGRES_USER:-aimedical}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMIVOICE_API_URL=${AMIVOICE_API_URL}
      - AMIVOICE_API_KEY=${AMIVOICE_API_KEY}
      - AMIVOICE_GRAMMAR=${AMIVOICE_GRAMMAR:--a-medical}
      - LLM_MODEL=${LLM_MODEL}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:- }
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HMAC_SECRET=${HMAC_SECRET}
      - SESSION_TIMEOUT_HOURS=${SESSION_TIMEOUT_HOURS:-3}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aimedical-network

  # Nginx (Reverse Proxy + Static Files) - HTTP Only
  frontend:
    image: nginx:alpine
    container_name: aimedical-frontend
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.notls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - static_files:/var/www/static:ro
      - media_files:/var/www/media:ro
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aimedical-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local

networks:
  aimedical-network:
    driver: bridge
