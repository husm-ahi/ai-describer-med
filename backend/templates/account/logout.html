{% load i18n %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログアウト - AI Describer Medical</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .logout-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logout-header h1 {
            color: #667eea;
            font-size: 28px;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            font-weight: bold;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-header">
            <h1>🏥 AI Describer Medical</h1>
            <p class="text-muted">ログアウト</p>
        </div>
        
        <div class="text-center mb-4">
            <i class="bi bi-box-arrow-right" style="font-size: 48px; color: #667eea;"></i>
            <h4 class="mt-3">ログアウトしますか?</h4>
            <p class="text-muted">セッションが終了されます。</p>
        </div>
        
        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            {% if redirect_field_value %}
            <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
            {% endif %}
            <button type="submit" class="btn btn-primary w-100 mb-2">
                <i class="bi bi-box-arrow-right"></i> ログアウトする
            </button>
            <a href="{% url 'core:index' %}" class="btn btn-outline-secondary w-100">
                <i class="bi bi-arrow-left"></i> キャンセル
            </a>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
