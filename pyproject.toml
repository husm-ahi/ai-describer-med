[project]
name = "ai-describer-med"
version = "0.1.0"
description = "医療向け音声認識・QRコード生成システム"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Department of Advanced Healthcare Informatics, Hamamatsu University School of Medicine" }
]

dependencies = [
    # Django core
    "django>=5.0,<6.0",
    "django-environ>=0.11.0",
    
    # WebSocket support
    "channels>=4.0,<5.0",
    "channels-redis>=4.2.0",
    "daphne>=4.1.0",
    
    # Authentication
    "django-allauth>=0.60,<1.0",
    
    # Database
    "psycopg[binary]>=3.1.0",
    
    # LLM integration
    "litellm>=1.17,<2.0",
    
    # AWS SDK (for Bedrock)
    "boto3>=1.34.0",
    
    # HTTP client
    "httpx>=0.27.0",
    
    # WebSocket client (for AmiVoice)
    "websockets>=12.0",
    
    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "django-stubs>=4.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.git
  | \.venv
  | \.eggs
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "staticfiles",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "channels.*",
    "litellm.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "backend.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
testpaths = ["tests"]
