[pytest]
DJANGO_SETTINGS_MODULE = backend.config.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --tb=short
    --reuse-db
testpaths = backend/core/tests
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
